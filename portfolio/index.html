<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Seleziona Categoria</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="icon" type="image/png" href="../assets/images/favicon SF.png">
</head>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const navContainer = document.querySelector('.nav-container');
        const navLinks = document.querySelector('.nav-links');

        if (navContainer && navLinks) {

            const toggleBtn = document.createElement('button');
            toggleBtn.className = 'menu-toggle';
            toggleBtn.setAttribute('aria-label', 'Menu');
            toggleBtn.innerHTML = '<span></span><span></span><span></span>';
            
            navContainer.appendChild(toggleBtn);

            toggleBtn.addEventListener('click', () => {
                toggleBtn.classList.toggle('is-active');
                navLinks.classList.toggle('is-open');
            });
        }
    });
</script>

<body>

    <header class="main-header">
        <nav class="nav-container">
            <div class="logo">
                <a href="../index.html">Serena Farina</a>
            </div>
            <ul class="nav-links">
                <li><a href="../index.html">Home</a></li>
                <li><a href="index.html" class="active">Portfolio</a></li>
                <li><a href="../cv/index.html">Curriculum</a></li>
                <li><a href="../contacts/index.html">Contatti</a></li>
            </ul>
        </nav>
    </header>


    <main class="portfolio-split-container">
        
        <!-- Sezione Interior Design -->
        <a href="interior-design" class="split-block interior-block">
            <div class="block-overlay"></div>
            <div class="block-content">
                <span class="block-category">01</span>
                <h2 class="block-title">Interior Design</h2>
                <span class="block-link">Esplora i progetti &rarr;</span>
            </div>
        </a>

        <!-- Sezione Fotografia -->
        <a href="photography" class="split-block photography-block">
            <div class="block-overlay"></div>
            <div class="block-content">
                <span class="block-category">02</span>
                <h2 class="block-title">Fotografia</h2>
                <span class="block-link">Esplora gli scatti &rarr;</span>
            </div>
        </a>
    </main>

</body>
</html>
