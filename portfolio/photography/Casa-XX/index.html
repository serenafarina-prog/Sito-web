<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casa XX | Fotografia</title>

    <link href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../assets/css/style.css">
    <link rel="icon" type="image/png" href="../../../assets/images/favicon SF.png">
</head>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const navContainer = document.querySelector('.nav-container');
        const navLinks = document.querySelector('.nav-links');

        if (navContainer && navLinks) {

            const toggleBtn = document.createElement('button');
            toggleBtn.className = 'menu-toggle';
            toggleBtn.setAttribute('aria-label', 'Menu');
            toggleBtn.innerHTML = '<span></span><span></span><span></span>';
            
            navContainer.appendChild(toggleBtn);


            toggleBtn.addEventListener('click', () => {
                toggleBtn.classList.toggle('is-active');
                navLinks.classList.toggle('is-open');
            });
        }
    });
</script>

<body>

    <header class="main-header">
        <nav class="nav-container">
            <div class="logo">
                <a href="../../../index.html">Serena Farina</a>
            </div>
            <ul class="nav-links">
                <li><a href="../../../index.html">Home</a></li>
                <li><a href="../../index.html" class="active">Portfolio</a></li>
                <li><a href="../../../cv/index.html">Curriculum</a></li>
                <li><a href="../../../contacts/index.html">Contatti</a></li>
            </ul>
        </nav>
    </header>

    <main class="project-detail-container">
        

        <header class="project-detail-header">
            <h1 class="project-title">Casa XX</h1>
            <p class="project-subtitle">Torino — 2024</p>
            <p class="project-description">
            </p>
        </header>

        <!-- Galleria Immagini del Progetto -->
        <section class="project-gallery">
            <!-- Foto Orizzontale -->
            <div class="gallery-row full">
                <img src="../../../assets/images/photography/Casa XX/Casa XX - 1.jpg" alt="Casa XX - Immagine 1" loading="lazy">
            </div>

            <!-- Foto Orizzontale -->
            <div class="gallery-row full">
                <img src="../../../assets/images/photography/Casa XX/Casa XX - 2.jpg" alt="Casa XX - Immagine 2" loading="lazy">
            </div>

            <!-- Foto Orizzontale -->
            <div class="gallery-row full">
                <img src="../../../assets/images/photography/Casa XX/Casa XX - 3.jpg" alt="Casa XX - Immagine 3" loading="lazy">
            </div>

            <!-- COPPIA VERTICALE -->
            <div class="gallery-row double-vertical">
                <div class="img-vertical">
                    <img src="../../../assets/images/photography/Casa XX/Casa XX - 4.jpg" alt="Casa XX - Immagine 4" loading="lazy">
                </div>
                <div class="img-vertical">
                    <img src="../../../assets/images/photography/Casa XX/Casa XX - 5.jpg" alt="Casa XX - Immagine 5" loading="lazy">
                </div>
            </div>

            <!-- COPPIA MISTA: 1 Orizzontale + 1 Verticale con orizzontale USCITA A SINISTRA -->            
            <div class="gallery-row mixed mixed-left">
                <div class="img-horizontal">
                    <img src="../../../assets/images/photography/Casa XX/Casa XX - 6.jpg" alt="Casa XX - Immagine 6" loading="lazy">
                </div>
                <div class="img-vertical">
                    <img src="../../../assets/images/photography/Casa XX/Casa XX - 7.jpg" alt="Casa XX - Immagine 7" loading="lazy">
                </div>
            </div>

            <!-- COPPIA MISTA: 1 Orizzontale + 1 Verticale con orizzontale USCITA A DESTRA -->            
            <div class="gallery-row mixed mixed-right">
                <div class="img-vertical">
                    <img src="../../../assets/images/photography/Casa XX/Casa XX - 8.jpg" alt="Casa XX - Immagine 8" loading="lazy">
                </div>
                <div class="img-horizontal">
                    <img src="../../../assets/images/photography/Casa XX/Casa XX - 9.jpg" alt="Casa XX - Immagine 9" loading="lazy">
                </div>
            </div>

            <!-- COPPIA MISTA: 1 Orizzontale + 1 Verticale con orizzontale USCITA A SINISTRA -->            
            <div class="gallery-row mixed mixed-left">
                <div class="img-horizontal">
                    <img src="../../../assets/images/photography/Casa XX/Casa XX - 10.jpg" alt="Casa XX - Immagine 10" loading="lazy">
                </div>
                <div class="img-vertical">
                    <img src="../../../assets/images/photography/Casa XX/Casa XX - 11.jpg" alt="Casa XX - Immagine 11" loading="lazy">
                </div>
            </div>

        </section>

    </main>

                <!-- Contenitore del pulsante torna indietro -->
        <div class="back-button-container">
            <a href="../index.html" class="back-btn">← TORNA AI PROGETTI DI FOTOGRAFIA</a>
        </div>


</body>
</html>
